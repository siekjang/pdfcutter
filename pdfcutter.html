<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 자르기</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- pdf-lib for PDF manipulation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- PDF.js for rendering PDF page thumbnails -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .thumbnail-card {
      transition: all 0.15s ease-in-out;
    }
    .thumbnail-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-700">

  <!-- Navigation Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3 text-left">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-scissors text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight text-slate-100">
            PDF 자르기
          </h1>
          <p class="text-[11px] text-slate-400">필요한 페이지만 선택해서 새 PDF 파일로 추출 및 저장</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button id="reset-btn" class="hidden px-3.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-rotate-left text-xs"></i>
          <span>다시 처음으로</span>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col">

    <!-- Upload Zone -->
    <label for="pdf-file-input" id="upload-zone" class="flex-1 min-h-[400px] flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl p-8 text-center bg-white hover:bg-slate-50/50 transition-all cursor-pointer group shadow-sm block">
      <input type="file" id="pdf-file-input" accept="application/pdf" class="sr-only">
      
      <div class="w-16 h-16 rounded-full bg-brand-50 group-hover:bg-brand-100 flex items-center justify-center text-brand-600 mb-4 transition-transform group-hover:scale-105 mx-auto">
        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
      </div>
      
      <h2 class="text-lg font-bold text-slate-800 mb-1">PDF 파일을 여기에 드래그하거나 클릭하세요</h2>
      <p class="text-xs text-slate-500 max-w-md mb-6 mx-auto">
        서버로 업로드하지 않고 브라우저에서 직접 처리하므로 파일이 안전합니다.
      </p>

      <div class="inline-flex items-center px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs sm:text-sm rounded-xl shadow transition-all space-x-2">
        <i class="fa-solid fa-folder-open"></i>
        <span>컴퓨터에서 파일 찾아보기</span>
      </div>
    </label>

    <!-- Workspace Container -->
    <div id="workspace" class="hidden flex-1 flex flex-col space-y-6">
      
      <!-- Control Toolbar -->
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        
        <div class="flex items-center space-x-3">
          <div class="p-2.5 bg-red-50 text-red-600 rounded-lg border border-red-100">
            <i class="fa-regular fa-file-pdf text-xl"></i>
          </div>
          <div>
            <h3 id="file-name" class="font-bold text-sm text-slate-900 truncate max-w-xs sm:max-w-md">filename.pdf</h3>
            <p id="file-meta" class="text-xs text-slate-500">총 0페이지 • 0 MB</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center bg-slate-100 p-1 rounded-lg text-xs font-medium">
            <button id="btn-select-all" class="px-3 py-1.5 rounded hover:bg-white text-slate-700 transition-all">전체 선택</button>
            <button id="btn-deselect-all" class="px-3 py-1.5 rounded hover:bg-white text-slate-700 transition-all">선택 해제</button>
            <button id="btn-invert-select" class="px-3 py-1.5 rounded hover:bg-white text-slate-700 transition-all">선택 반전</button>
          </div>

          <div class="relative flex items-center">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-list-ol text-xs"></i>
            </div>
            <input type="text" id="page-range-input" placeholder="범위 입력 (예: 1, 3-5)" class="pl-8 pr-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none w-44 sm:w-52">
          </div>

          <button id="btn-download" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-xl shadow transition-all flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-scissors"></i>
            <span>자르기 및 저장 (<span id="selected-count">0</span>)</span>
          </button>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loading-spinner" class="py-12 flex flex-col items-center justify-center space-y-3">
        <div class="w-8 h-8 border-3 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
        <p class="text-xs font-medium text-slate-600">페이지 썸네일을 생성하는 중입니다...</p>
      </div>

      <!-- Thumbnails Grid -->
      <div id="thumbnail-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 overflow-y-auto max-h-[calc(100vh-280px)] p-1">
        <!-- Dynamically populated page cards -->
      </div>

    </div>

  </main>

  <!-- Preview Modal -->
  <div id="preview-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 id="modal-title" class="font-bold text-slate-800 text-sm">페이지 상세보기</h3>
        <button id="close-modal-btn" class="w-7 h-7 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-600 transition-colors text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 flex-1 overflow-auto flex items-center justify-center bg-slate-100">
        <canvas id="modal-canvas" class="max-w-full h-auto shadow-md rounded border border-slate-200"></canvas>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      } catch (e) {
        console.warn('PDF.js worker fallback initialized.');
      }
    }

    const state = {
      file: null,
      pdfjsDoc: null,
      arrayBuffer: null,
      totalPages: 0,
      selectedPages: new Set()
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Elements
      const dropzone = document.getElementById('upload-zone');
      const fileInput = document.getElementById('pdf-file-input');
      const workspace = document.getElementById('workspace');
      const fileNameEl = document.getElementById('file-name');
      const fileMetaEl = document.getElementById('file-meta');
      const loadingSpinner = document.getElementById('loading-spinner');
      const thumbnailGrid = document.getElementById('thumbnail-grid');
      const pageRangeInput = document.getElementById('page-range-input');
      const selectedCountEl = document.getElementById('selected-count');
      const resetBtn = document.getElementById('reset-btn');

      const btnSelectAll = document.getElementById('btn-select-all');
      const btnDeselectAll = document.getElementById('btn-deselect-all');
      const btnInvertSelect = document.getElementById('btn-invert-select');
      const btnDownload = document.getElementById('btn-download');

      const previewModal = document.getElementById('preview-modal');
      const closeModalBtn = document.getElementById('close-modal-btn');
      const modalTitle = document.getElementById('modal-title');
      const modalCanvas = document.getElementById('modal-canvas');

      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        const colors = {
          success: 'bg-emerald-600 text-white',
          error: 'bg-red-600 text-white',
          info: 'bg-slate-800 text-white'
        };

        toast.className = `px-4 py-2.5 rounded-xl shadow-md text-xs font-medium flex items-center space-x-2 pointer-events-auto transition-all transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
        toast.innerHTML = `
          <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info'}"></i>
          <span>${message}</span>
        `;

        const container = document.getElementById('toast-container');
        if (container) {
          container.appendChild(toast);
          requestAnimationFrame(() => {
            toast.classList.remove('translate-y-2', 'opacity-0');
          });
          setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-2');
            setTimeout(() => toast.remove(), 300);
          }, 3000);
        }
      }

      function resetCropperState() {
        state.file = null;
        state.pdfjsDoc = null;
        state.arrayBuffer = null;
        state.totalPages = 0;
        state.selectedPages.clear();

        if (fileInput) fileInput.value = '';
        if (thumbnailGrid) thumbnailGrid.innerHTML = '';
        if (pageRangeInput) pageRangeInput.value = '';
        
        if (workspace) workspace.classList.add('hidden');
        if (dropzone) dropzone.classList.remove('hidden');
        if (resetBtn) resetBtn.classList.add('hidden');
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', resetCropperState);
      }

      if (dropzone) {
        dropzone.addEventListener('dragover', (e) => {
          e.preventDefault();
          dropzone.classList.add('border-brand-500', 'bg-brand-50/50');
        });
        dropzone.addEventListener('dragleave', () => {
          dropzone.classList.remove('border-brand-500', 'bg-brand-50/50');
        });
        dropzone.addEventListener('drop', (e) => {
          e.preventDefault();
          dropzone.classList.remove('border-brand-500', 'bg-brand-50/50');
          const files = e.dataTransfer.files;
          if (files.length > 0 && files[0].type === 'application/pdf') {
            loadPdfFile(files[0]);
          } else {
            showToast('PDF 파일만 등록할 수 있습니다.', 'error');
          }
        });
      }

      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files.length > 0) {
            loadPdfFile(e.target.files[0]);
          }
        });
      }

      async function loadPdfFile(file) {
        if (typeof pdfjsLib === 'undefined') {
          showToast('PDF 라이브러리를 불러오지 못했습니다.', 'error');
          return;
        }

        state.file = file;
        fileNameEl.textContent = file.name;
        fileMetaEl.textContent = `불러오는 중... (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;

        dropzone.classList.add('hidden');
        workspace.classList.remove('hidden');
        if (resetBtn) resetBtn.classList.remove('hidden');
        loadingSpinner.classList.remove('hidden');
        thumbnailGrid.innerHTML = '';

        try {
          state.arrayBuffer = await file.arrayBuffer();
          
          const loadingTask = pdfjsLib.getDocument({ data: state.arrayBuffer.slice(0) });
          state.pdfjsDoc = await loadingTask.promise;
          state.totalPages = state.pdfjsDoc.numPages;

          fileMetaEl.textContent = `총 ${state.totalPages}페이지 • ${(file.size / (1024 * 1024)).toFixed(2)} MB`;

          for (let i = 0; i < state.totalPages; i++) {
            state.selectedPages.add(i);
          }

          updateSelectionUI();
          await renderAllThumbnails();

          showToast('PDF 파일을 정상적으로 불러왔습니다.', 'success');
        } catch (err) {
          console.error(err);
          showToast('PDF 파일을 읽는 중 오류가 발생했습니다.', 'error');
          resetCropperState();
        } finally {
          loadingSpinner.classList.add('hidden');
        }
      }

      async function renderAllThumbnails() {
        thumbnailGrid.innerHTML = '';

        for (let pageNum = 1; pageNum <= state.totalPages; pageNum++) {
          const pageIdx = pageNum - 1;
          
          const card = document.createElement('div');
          card.dataset.pageIdx = pageIdx;
          card.className = `thumbnail-card relative bg-white rounded-xl border-2 p-3 cursor-pointer select-none flex flex-col items-center justify-between shadow-sm ${
            state.selectedPages.has(pageIdx) ? 'border-brand-500 bg-brand-50/20' : 'border-slate-200'
          }`;

          card.innerHTML = `
            <div class="w-full flex items-center justify-between mb-2">
              <span class="inline-flex items-center justify-center px-2 py-0.5 rounded text-xs font-bold ${
                state.selectedPages.has(pageIdx) ? 'bg-brand-600 text-white' : 'bg-slate-200 text-slate-700'
              } page-badge">
                ${pageNum}
              </span>
              <div class="flex items-center space-x-1">
                <button title="확대 보기" class="btn-inspect p-1 text-slate-400 hover:text-brand-600 rounded transition-colors">
                  <i class="fa-solid fa-magnifying-glass-plus text-xs"></i>
                </button>
                <input type="checkbox" ${state.selectedPages.has(pageIdx) ? 'checked' : ''} class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500 pointer-events-none">
              </div>
            </div>
            <div class="canvas-wrapper flex-1 flex items-center justify-center w-full min-h-[160px] bg-slate-50 rounded border border-slate-100 overflow-hidden">
              <canvas class="max-w-full max-h-[180px] object-contain"></canvas>
            </div>
          `;

          thumbnailGrid.appendChild(card);

          card.addEventListener('click', (e) => {
            if (e.target.closest('.btn-inspect')) {
              e.stopPropagation();
              openModalPreview(pageNum);
              return;
            }
            togglePageSelection(pageIdx);
          });

          renderThumbnailPage(pageNum, card.querySelector('canvas'));
        }
      }

      async function renderThumbnailPage(pageNum, canvas) {
        try {
          const page = await state.pdfjsDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 0.3 });
          const context = canvas.getContext('2d');

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        } catch (err) {
          console.error(`Page ${pageNum} render error:`, err);
        }
      }

      function togglePageSelection(pageIdx) {
        if (state.selectedPages.has(pageIdx)) {
          state.selectedPages.delete(pageIdx);
        } else {
          state.selectedPages.add(pageIdx);
        }
        syncCardState(pageIdx);
        updateSelectionUI(true);
      }

      function syncCardState(pageIdx) {
        const card = thumbnailGrid.querySelector(`[data-page-idx="${pageIdx}"]`);
        if (!card) return;

        const isSelected = state.selectedPages.has(pageIdx);
        const checkbox = card.querySelector('input[type="checkbox"]');
        const badge = card.querySelector('.page-badge');

        if (checkbox) checkbox.checked = isSelected;

        if (isSelected) {
          card.className = card.className.replace(/border-slate-200/g, 'border-brand-500 bg-brand-50/20');
          if (badge) badge.className = 'inline-flex items-center justify-center px-2 py-0.5 rounded text-xs font-bold bg-brand-600 text-white page-badge';
        } else {
          card.className = card.className.replace(/border-brand-500 bg-brand-50\/20/g, 'border-slate-200');
          if (badge) badge.className = 'inline-flex items-center justify-center px-2 py-0.5 rounded text-xs font-bold bg-slate-200 text-slate-700 page-badge';
        }
      }

      function updateSelectionUI(updateInputText = true) {
        const selectedCount = state.selectedPages.size;
        selectedCountEl.textContent = `${selectedCount}페이지`;
        btnDownload.disabled = selectedCount === 0;

        if (updateInputText && pageRangeInput) {
          pageRangeInput.value = formatSelectedPagesToRange();
        }
      }

      function formatSelectedPagesToRange() {
        if (state.selectedPages.size === 0) return '';
        
        const sorted = Array.from(state.selectedPages).map(idx => idx + 1).sort((a, b) => a - b);
        const ranges = [];
        let start = sorted[0];
        let end = start;

        for (let i = 1; i < sorted.length; i++) {
          if (sorted[i] === end + 1) {
            end = sorted[i];
          } else {
            ranges.push(start === end ? `${start}` : `${start}-${end}`);
            start = sorted[i];
            end = start;
          }
        }
        ranges.push(start === end ? `${start}` : `${start}-${end}`);
        return ranges.join(', ');
      }

      function parseRangeInputToSet(rangeStr) {
        const pages = new Set();
        const parts = rangeStr.split(',');

        for (let part of parts) {
          part = part.trim();
          if (!part) continue;

          if (part.includes('-')) {
            const [startStr, endStr] = part.split('-').map(s => s.trim());
            const start = parseInt(startStr, 10);
            const end = parseInt(endStr, 10);

            if (!isNaN(start) && !isNaN(end)) {
              const min = Math.min(start, end);
              const max = Math.max(start, end);
              for (let i = min; i <= max; i++) {
                if (i >= 1 && i <= state.totalPages) pages.add(i - 1);
              }
            }
          } else {
            const pageNum = parseInt(part, 10);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= state.totalPages) {
              pages.add(pageNum - 1);
            }
          }
        }
        return pages;
      }

      if (pageRangeInput) {
        pageRangeInput.addEventListener('input', (e) => {
          const parsedSet = parseRangeInputToSet(e.target.value);
          state.selectedPages = parsedSet;
          
          for (let i = 0; i < state.totalPages; i++) {
            syncCardState(i);
          }
          updateSelectionUI(false);
        });
      }

      if (btnSelectAll) {
        btnSelectAll.addEventListener('click', () => {
          for (let i = 0; i < state.totalPages; i++) state.selectedPages.add(i);
          for (let i = 0; i < state.totalPages; i++) syncCardState(i);
          updateSelectionUI(true);
        });
      }

      if (btnDeselectAll) {
        btnDeselectAll.addEventListener('click', () => {
          state.selectedPages.clear();
          for (let i = 0; i < state.totalPages; i++) syncCardState(i);
          updateSelectionUI(true);
        });
      }

      if (btnInvertSelect) {
        btnInvertSelect.addEventListener('click', () => {
          for (let i = 0; i < state.totalPages; i++) {
            if (state.selectedPages.has(i)) {
              state.selectedPages.delete(i);
            } else {
              state.selectedPages.add(i);
            }
            syncCardState(i);
          }
          updateSelectionUI(true);
        });
      }

      async function openModalPreview(pageNum) {
        if (!modalTitle || !previewModal || !modalCanvas) return;
        modalTitle.textContent = `${state.file ? state.file.name : ''} - ${pageNum} 페이지 확대 보기`;
        previewModal.classList.remove('hidden');

        try {
          const page = await state.pdfjsDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          const context = modalCanvas.getContext('2d');

          modalCanvas.width = viewport.width;
          modalCanvas.height = viewport.height;

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        } catch (err) {
          console.error('Modal preview render error:', err);
        }
      }

      if (closeModalBtn) {
        closeModalBtn.addEventListener('click', () => {
          previewModal.classList.add('hidden');
        });
      }

      if (previewModal) {
        previewModal.addEventListener('click', (e) => {
          if (e.target === previewModal) previewModal.classList.add('hidden');
        });
      }

      if (btnDownload) {
        btnDownload.addEventListener('click', async () => {
          if (state.selectedPages.size === 0) {
            showToast('선택된 페이지가 없습니다.', 'error');
            return;
          }

          if (typeof PDFLib === 'undefined') {
            showToast('PDFLib 라이브러리를 불러오지 못했습니다.', 'error');
            return;
          }

          btnDownload.disabled = true;
          btnDownload.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>생성 중...</span>`;

          try {
            const srcPdf = await PDFLib.PDFDocument.load(state.arrayBuffer);
            const newPdf = await PDFLib.PDFDocument.create();

            const sortedIndices = Array.from(state.selectedPages).sort((a, b) => a - b);
            const copiedPages = await newPdf.copyPages(srcPdf, sortedIndices);
            copiedPages.forEach(page => newPdf.addPage(page));

            const pdfBytes = await newPdf.save();

            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const downloadUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            const baseName = state.file ? state.file.name.replace(/\.pdf$/i, '') : 'extracted';
            link.href = downloadUrl;
            link.download = `${baseName}_cut.pdf`;
            link.click();
            
            URL.revokeObjectURL(downloadUrl);
            showToast('PDF 자르기가 완료되었습니다.', 'success');
          } catch (err) {
            console.error(err);
            showToast('PDF 처리 중 오류가 발생했습니다.', 'error');
          } finally {
            updateSelectionUI(true);
            btnDownload.disabled = false;
            btnDownload.innerHTML = `<i class="fa-solid fa-scissors"></i> <span>자르기 및 저장 (<span id="selected-count">${state.selectedPages.size}</span>)</span>`;
          }
        });
      }
    });
  </script>
