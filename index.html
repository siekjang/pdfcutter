<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 자르기</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- pdf-lib for PDF manipulation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- PDF.js for rendering PDF page thumbnails -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .thumbnail-card {
      transition: all 0.15s ease-in-out;
    }
    .thumbnail-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-700">

  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3 text-left">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-scissors text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight text-slate-100">
            PDF 자르기
          </h1>
          <p class="text-[11px] text-slate-400">필요한 페이지만 선택해서 새 PDF 파일로 추출 및 저장</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 숭문AI코디 버튼 (링크 비활성화, 스파클 아이콘) -->
        <a href="#" onclick="return false;" class="px-3.5 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-all flex items-center space-x-1.5 shadow-sm border border-indigo-400/30 cursor-pointer">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          <span>숭문AI코디</span>
        </a>

        <button id="reset-btn" class="hidden px-3.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-rotate-left text-xs"></i>
          <span>다시 처음으로</span>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col">

    <!-- Upload Zone -->
    <label for="pdf-file-input" id="upload-zone" class="flex-1 min-h-[380px] flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl p-8 text-center bg-white hover:bg-slate-50/50 transition-all cursor-pointer group shadow-sm block">
      <input type="file" id="pdf-file-input" accept="application/pdf" class="sr-only">
      
      <div class="w-16 h-16 rounded-full bg-brand-50 group-hover:bg-brand-100 flex items-center justify-center text-brand-600 mb-4 transition-transform group-hover:scale-105 mx-auto">
        <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
      </div>
      
      <h3 class="text-lg font-bold text-slate-800 mb-1">PDF 파일을 여기에 드래그하거나 클릭하세요</h3>
      <p class="text-xs text-slate-500 max-w-md mb-6 mx-auto">
        파일은 서버로 전송되지 않으며 컴퓨터 내부에서 안전하게 처리됩니다.
      </p>

      <div class="inline-flex items-center px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs sm:text-sm rounded-xl shadow transition-all space-x-2">
        <i class="fa-solid fa-folder-open"></i>
        <span>컴퓨터에서 파일 선택</span>
      </div>
    </label>

    <!-- Workspace -->
    <div id="workspace" class="hidden flex-1 flex flex-col space-y-6">
      
      <!-- Control Toolbar -->
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        
        <div class="flex items-center space-x-3">
          <div class="p-2.5 bg-red-50 text-red-600 rounded-lg border border-red-100">
            <i class="fa-regular fa-file-pdf text-xl"></i>
          </div>
          <div>
            <h3 id="file-name" class="font-bold text-sm text-slate-900 truncate max-w-xs sm:max-w-md">filename.pdf</h3>
            <p id="file-meta" class="text-xs text-slate-500">총 0페이지 • 0 MB</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center bg-slate-100 p-1 rounded-lg text-xs font-medium">
            <button id="btn-select-all" class="px-3 py-1.5 rounded hover:bg-white text-slate-700 transition-all">전체 선택</button>
            <button id="btn-deselect-all" class="px-3 py-1.5 rounded hover:bg-white text-slate-700 transition-all">선택 해제</button>
            <button id="btn-invert-select" class="px-3 py-1.5 rounded hover:bg-white text-slate-700 transition-all">선택 반전</button>
          </div>

          <div class="relative flex items-center">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-list-ol text-xs"></i>
            </div>
            <input type="text" id="page-range-input" placeholder="범위 입력 (예: 1, 3-5)" class="pl-8 pr-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none w-44 sm:w-52">
          </div>

          <button id="btn-download" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-xl shadow transition-all flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-scissors"></i>
            <span>자르기 및 저장 (<span id="selected-count">0</span>)</span>
          </button>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loading-spinner" class="py-12 flex flex-col items-center justify-center space-y-3">
        <div class="w-8 h-8 border-3 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
        <p class="text-xs font-medium text-slate-600">PDF 페이지 썸네일을 불러오고 있습니다...</p>
      </div>

      <!-- Grid Container -->
      <div id="thumbnail-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 overflow-y-auto max-h-[calc(100vh-280px)] p-1">
        <!-- Rendered dynamically -->
      </div>

    </div>

  </main>

  <div id="preview-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 id="modal-title" class="font-bold text-slate-800 text-sm">페이지 상세보기</h3>
        <button id="close-modal-btn" class="w-7 h-7 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-600 transition-colors text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 flex-1 overflow-auto flex items-center justify-center bg-slate-100">
        <canvas id="modal-canvas" class="max-w-full h-auto shadow-md rounded border border-slate-200"></canvas>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Application state
    let pdfDoc = null;
    let pdfBytes = null;
    let totalPages = 0;
    let currentFileName = '';
    let selectedPages = new Set();

    // DOM Elements
    const uploadZone = document.getElementById('upload-zone');
    const pdfFileInput = document.getElementById('pdf-file-input');
    const workspace = document.getElementById('workspace');
    const resetBtn = document.getElementById('reset-btn');

    const fileNameEl = document.getElementById('file-name');
    const fileMetaEl = document.getElementById('file-meta');
    const pageRangeInput = document.getElementById('page-range-input');
    const selectedCountEl = document.getElementById('selected-count');

    const loadingSpinner = document.getElementById('loading-spinner');
    const thumbnailGrid = document.getElementById('thumbnail-grid');
    const btnDownload = document.getElementById('btn-download');

    const btnSelectAll = document.getElementById('btn-select-all');
    const btnDeselectAll = document.getElementById('btn-deselect-all');
    const btnInvertSelect = document.getElementById('btn-invert-select');

    const previewModal = document.getElementById('preview-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modalCanvas = document.getElementById('modal-canvas');
    const modalTitle = document.getElementById('modal-title');

    // Notification toast generator
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white transition-all transform translate-y-2 opacity-0 flex items-center space-x-2 ${
        type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'
      }`;
      toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-sm"></i> <span>${message}</span>`;
      
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

    // Drag and drop handlers
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('border-brand-500', 'bg-brand-50/30');
    });

    uploadZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('border-brand-500', 'bg-brand-50/30');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('border-brand-500', 'bg-brand-50/30');
      if (e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    pdfFileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    // Reset application state
    resetBtn.addEventListener('click', resetApp);

    function resetApp() {
      pdfDoc = null;
      pdfBytes = null;
      totalPages = 0;
      currentFileName = '';
      selectedPages.clear();
      
      pdfFileInput.value = '';
      pageRangeInput.value = '';
      thumbnailGrid.innerHTML = '';
      
      workspace.classList.add('hidden');
      resetBtn.classList.add('hidden');
      uploadZone.classList.remove('hidden');
    }

    // Handle PDF file selection
    async function handleFileSelect(file) {
      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        showToast('PDF 파일만 선택이 가능합니다.', 'error');
        return;
      }

      currentFileName = file.name;
      const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);

      fileNameEl.textContent = file.name;
      fileMetaEl.textContent = `불러오는 중... (${fileSizeMB} MB)`;

      uploadZone.classList.add('hidden');
      workspace.classList.remove('hidden');
      resetBtn.classList.remove('hidden');
      loadingSpinner.classList.remove('hidden');
      thumbnailGrid.innerHTML = '';

      try {
        pdfBytes = await file.arrayBuffer();
        
        // Load with pdfjsLib
        const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(pdfBytes.slice(0)) });
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        fileMetaEl.textContent = `총 ${totalPages}페이지 • ${fileSizeMB} MB`;

        // Select all by default
        selectedPages = new Set(Array.from({ length: totalPages }, (_, i) => i + 1));
        updateUISelection();

        // Render thumbnails
        await renderThumbnails();

        showToast('PDF 파일을 정상적으로 불러왔습니다.', 'success');
      } catch (err) {
        console.error(err);
        showToast('PDF 파일을 읽는 도중 오류가 발생했습니다.', 'error');
        resetApp();
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    }

    // Render thumbnail grid
    async function renderThumbnails() {
      thumbnailGrid.innerHTML = '';

      for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
        const card = document.createElement('div');
        card.className = `thumbnail-card relative border-2 rounded-xl p-2 bg-white cursor-pointer flex flex-col items-center select-none shadow-sm transition-all ${
          selectedPages.has(pageNum) ? 'border-brand-500 bg-brand-50/20 ring-2 ring-brand-500/20' : 'border-slate-200 hover:border-slate-300'
        }`;
        card.dataset.pageNum = pageNum;

        // Card header
        const header = document.createElement('div');
        header.className = 'w-full flex items-center justify-between mb-1.5 px-1';
        header.innerHTML = `
          <div class="flex items-center space-x-1.5">
            <input type="checkbox" ${selectedPages.has(pageNum) ? 'checked' : ''} class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 pointer-events-none">
            <span class="text-xs font-bold text-slate-700">${pageNum}P</span>
          </div>
          <button title="자세히 보기" class="btn-inspect-page p-1 text-slate-400 hover:text-brand-600 rounded transition-colors" data-page="${pageNum}">
            <i class="fa-solid fa-magnifying-glass-plus text-xs"></i>
          </button>
        `;

        // Canvas element
        const canvasContainer = document.createElement('div');
        canvasContainer.className = 'w-full aspect-[1/1.4] bg-slate-100 rounded border border-slate-100 flex items-center justify-center overflow-hidden relative';
        
        const canvas = document.createElement('canvas');
        canvas.className = 'max-w-full max-h-full object-contain';
        canvasContainer.appendChild(canvas);

        card.appendChild(header);
        card.appendChild(canvasContainer);
        thumbnailGrid.appendChild(card);

        // Render canvas page preview
        renderCanvasPage(pageNum, canvas);

        // Click handler to toggle selection
        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-inspect-page')) {
            e.stopPropagation();
            openModal(parseInt(e.target.closest('.btn-inspect-page').dataset.page, 10));
            return;
          }

          if (selectedPages.has(pageNum)) {
            selectedPages.delete(pageNum);
          } else {
            selectedPages.add(pageNum);
          }
          updateUISelection();
        });
      }
    }

    // Render page preview onto canvas
    async function renderCanvasPage(pageNum, canvas, scale = 0.3) {
      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale });
        
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };
        await page.render(renderContext).promise;
      } catch (err) {
        console.error('Thumbnail render error:', err);
      }
    }

    // Selection UI synchronization
    function updateUISelection() {
      selectedCountEl.textContent = selectedPages.size;
      btnDownload.disabled = selectedPages.size === 0;

      // Update Card styles
      const cards = thumbnailGrid.querySelectorAll('.thumbnail-card');
      cards.forEach(card => {
        const pNum = parseInt(card.dataset.pageNum, 10);
        const checkbox = card.querySelector('input[type="checkbox"]');
        
        if (selectedPages.has(pNum)) {
          card.className = card.className.replace(/border-slate-200|hover:border-slate-300/g, '').trim();
          if (!card.classList.contains('border-brand-500')) {
            card.classList.add('border-brand-500', 'bg-brand-50/20', 'ring-2', 'ring-brand-500/20');
          }
          if (checkbox) checkbox.checked = true;
        } else {
          card.classList.remove('border-brand-500', 'bg-brand-50/20', 'ring-2', 'ring-brand-500/20');
          card.classList.add('border-slate-200', 'hover:border-slate-300');
          if (checkbox) checkbox.checked = false;
        }
      });

      // Format page range input
      const sorted = Array.from(selectedPages).sort((a, b) => a - b);
      pageRangeInput.value = formatPageRange(sorted);
    }

    // Format integer array to range format string (e.g., "1, 3-5, 8")
    function formatPageRange(pages) {
      if (pages.length === 0) return '';
      const ranges = [];
      let start = pages[0];
      let end = start;

      for (let i = 1; i < pages.length; i++) {
        if (pages[i] === end + 1) {
          end = pages[i];
        } else {
          ranges.push(start === end ? `${start}` : `${start}-${end}`);
          start = pages[i];
          end = start;
        }
      }
      ranges.push(start === end ? `${start}` : `${start}-${end}`);
      return ranges.join(', ');
    }

    // Parse input text range format into integer set
    function parsePageRangeInput(text) {
      const newPages = new Set();
      const parts = text.split(',');

      for (let part of parts) {
        part = part.trim();
        if (part.includes('-')) {
          const [startStr, endStr] = part.split('-');
          const start = parseInt(startStr, 10);
          const end = parseInt(endStr, 10);
          if (!isNaN(start) && !isNaN(end)) {
            const min = Math.min(start, end);
            const max = Math.max(start, end);
            for (let i = min; i <= max; i++) {
              if (i >= 1 && i <= totalPages) newPages.add(i);
            }
          }
        } else {
          const p = parseInt(part, 10);
          if (!isNaN(p) && p >= 1 && p <= totalPages) {
            newPages.add(p);
          }
        }
      }
      return newPages;
    }

    // Range input live update
    pageRangeInput.addEventListener('input', (e) => {
      selectedPages = parsePageRangeInput(e.target.value);
      selectedCountEl.textContent = selectedPages.size;
      btnDownload.disabled = selectedPages.size === 0;

      const cards = thumbnailGrid.querySelectorAll('.thumbnail-card');
      cards.forEach(card => {
        const pNum = parseInt(card.dataset.pageNum, 10);
        const checkbox = card.querySelector('input[type="checkbox"]');
        if (selectedPages.has(pNum)) {
          card.classList.add('border-brand-500', 'bg-brand-50/20', 'ring-2', 'ring-brand-500/20');
          card.classList.remove('border-slate-200');
          if (checkbox) checkbox.checked = true;
        } else {
          card.classList.remove('border-brand-500', 'bg-brand-50/20', 'ring-2', 'ring-brand-500/20');
          card.classList.add('border-slate-200');
          if (checkbox) checkbox.checked = false;
        }
      });
    });

    // Select buttons
    btnSelectAll.addEventListener('click', () => {
      selectedPages = new Set(Array.from({ length: totalPages }, (_, i) => i + 1));
      updateUISelection();
    });

    btnDeselectAll.addEventListener('click', () => {
      selectedPages.clear();
      updateUISelection();
    });

    btnInvertSelect.addEventListener('click', () => {
      const newPages = new Set();
      for (let i = 1; i <= totalPages; i++) {
        if (!selectedPages.has(i)) newPages.add(i);
      }
      selectedPages = newPages;
      updateUISelection();
    });

    // Inspection Modal
    async function openModal(pageNum) {
      modalTitle.textContent = `${currentFileName} - 페이지 ${pageNum}`;
      previewModal.classList.remove('hidden');
      await renderCanvasPage(pageNum, modalCanvas, 1.2);
    }

    closeModalBtn.addEventListener('click', () => {
      previewModal.classList.add('hidden');
    });

    previewModal.addEventListener('click', (e) => {
      if (e.target === previewModal) previewModal.classList.add('hidden');
    });

    // PDF Export and Download using pdf-lib
    btnDownload.addEventListener('click', async () => {
      if (selectedPages.size === 0) {
        showToast('저장할 페이지를 하나 이상 선택해 주세요.', 'error');
        return;
      }

      const originalBtnText = btnDownload.innerHTML;
      btnDownload.disabled = true;
      btnDownload.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>생성 중...</span>`;

      try {
        const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
        const newDoc = await PDFLib.PDFDocument.create();

        // 0-based indices for pdf-lib
        const pageIndices = Array.from(selectedPages)
          .sort((a, b) => a - b)
          .map(p => p - 1);

        const copiedPages = await newDoc.copyPages(srcDoc, pageIndices);
        copiedPages.forEach(p => newDoc.addPage(p));

        const newPdfBytes = await newDoc.save();

        // Download trigger
        const blob = new Blob([newPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        
        const baseName = currentFileName.replace(/\.pdf$/i, '');
        link.download = `${baseName}_cut.pdf`;
        link.click();
        
        URL.revokeObjectURL(link.href);
        showToast('PDF 파일 생성이 완료되어 다운로드되었습니다.', 'success');
      } catch (err) {
        console.error(err);
        showToast('PDF 파일 생성 중 오류가 발생했습니다.', 'error');
      } finally {
        btnDownload.disabled = false;
        btnDownload.innerHTML = originalBtnText;
      }
    });
  </script>
</body>
</html>
